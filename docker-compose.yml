version: "3.7"

services:
  app:
    image: gaqptracker:latest
    volumes:
      - public:/app/www
      - ./qp-calls.txt:/app/qp-calls.txt

  nginx:
    image: nginx:stable-alpine
    ports:
      - 7373:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # share files from web
      - public:/static:ro

volumes:
  public:
